    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {

<style>
  body { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  h1,h2,h3,h4,.font-heading { font-family: 'Quicksand', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 8px; }

  .soft-shadow { box-shadow: 0 14px 34px -10px rgba(17,26,54,0.08), 0 2px 10px -2px rgba(17,26,54,0.04); }
  .soft-shadow-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
  .soft-shadow-hover:hover { box-shadow: 0 20px 40px -10px rgba(17,26,54,0.12), 0 4px 16px -2px rgba(31,174,122,0.15); transform: translateY(-3px); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #root { animation: fadeIn 0.25s ease-out; }

  /* ===========================================================
     DARK MODE
     Overrides the hardcoded light-mode utility colors used
     throughout the prototype whenever <html> has the "dark"
     class. Toggled by toggleTheme() in the app script below.
     =========================================================== */
  html, body { transition: background-color .25s ease, color .25s ease; }
  * { transition: background-color .2s ease, border-color .2s ease, color .2s ease; }

  html.dark { color-scheme: dark; }
  html.dark body { background-color: #0B1021; color: #F8FAFC; }
  html.dark ::-webkit-scrollbar-thumb { background: #334155; }
  html.dark .soft-shadow { box-shadow: 0 14px 34px -10px rgba(0,0,0,0.55), 0 2px 10px -2px rgba(0,0,0,0.3); }
  html.dark .soft-shadow-hover:hover { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), 0 4px 16px -2px rgba(52,211,153,0.2); }

  /* Page / panel surfaces */
  html.dark .bg-\[\#FAF8FF\] { background-color: #0B1021 !important; }
  html.dark .bg-\[\#FFFBEF\] { background-color: #0B1021 !important; }
  html.dark .bg-white { background-color: #1E294B !important; }
  html.dark .bg-white\/30 { background-color: rgba(30,41,75,0.3) !important; }
  html.dark .bg-white\/85 { background-color: rgba(14,22,43,0.85) !important; }
  html.dark .bg-white\/90 { background-color: rgba(14,22,43,0.9) !important; }
  html.dark .bg-white\/95 { background-color: rgba(14,22,43,0.95) !important; }
  html.dark .border-white { border-color: #1E294B !important; }

  /* Dark navy elements (e.g. "positioning" hero card) -> blend as a raised card */
  html.dark .bg-\[\#111A36\] { background-color: #1E294B !important; }
  html.dark .border-\[\#111A36\] { border-color: #1E294B !important; }
  /* Selected filter chip -> vivid violet pop in dark */
  html.dark .chip-active { background-color: #7726E0 !important; border-color: #7726E0 !important; }

  /* Tinted brand backgrounds */
  html.dark .bg-\[\#E8ECF8\] { background-color: #16203D !important; }
  html.dark .bg-\[\#E8F8F2\] { background-color: #064E3B !important; }
  html.dark .bg-\[\#F2F3FF\] { background-color: #16203D !important; }
  html.dark .bg-\[\#F3EBFF\] { background-color: #2E1065 !important; }
  html.dark .bg-\[\#FFF5E6\] { background-color: #451A03 !important; }
  html.dark .bg-emerald-100\/30 { background-color: rgba(6,78,59,0.25) !important; }
  html.dark .bg-emerald-100\/40 { background-color: rgba(6,78,59,0.3) !important; }
  html.dark .bg-amber-50\/60 { background-color: rgba(69,26,3,0.4) !important; }

  /* Decorative gradient blobs / hero panels */
  html.dark .from-\[\#F2F4FD\] { --tw-gradient-from: #1E294B var(--tw-gradient-from-position) !important; --tw-gradient-to: rgb(30 41 75 / 0) var(--tw-gradient-to-position) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
  html.dark .from-\[\#F3EBFF\] { --tw-gradient-from: #2E1065 var(--tw-gradient-from-position) !important; --tw-gradient-to: rgb(46 16 101 / 0) var(--tw-gradient-to-position) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
  html.dark .from-purple-100\/50 { --tw-gradient-from: rgba(88,28,135,0.35) var(--tw-gradient-from-position) !important; --tw-gradient-to: rgb(88 28 135 / 0) var(--tw-gradient-to-position) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
  html.dark .via-indigo-50\/30 { --tw-gradient-stops: var(--tw-gradient-from), rgba(30,27,75,0.25) var(--tw-gradient-via-position), var(--tw-gradient-to) !important; }
  html.dark .via-indigo-50\/40 { --tw-gradient-stops: var(--tw-gradient-from), rgba(30,27,75,0.3) var(--tw-gradient-via-position), var(--tw-gradient-to) !important; }
  html.dark .via-\[\#E8F8F2\] { --tw-gradient-stops: var(--tw-gradient-from), #064E3B var(--tw-gradient-via-position), var(--tw-gradient-to) !important; }
  html.dark .via-\[\#FAF8FF\] { --tw-gradient-stops: var(--tw-gradient-from), #0B1021 var(--tw-gradient-via-position), var(--tw-gradient-to) !important; }
  html.dark .to-\[\#EAEFFF\] { --tw-gradient-to: #16203D var(--tw-gradient-to-position) !important; }
  html.dark .to-\[\#FFF5E6\] { --tw-gradient-to: #451A03 var(--tw-gradient-to-position) !important; }

  /* Text colors */
  html.dark .text-\[\#006C49\] { color: #34D399 !important; }
  html.dark .text-\[\#111A36\] { color: #F8FAFC !important; }
  html.dark .text-\[\#3B4261\] { color: #CBD5E1 !important; }
  html.dark .text-\[\#626987\] { color: #94A3B8 !important; }
  html.dark .text-\[\#7726E0\] { color: #C4B5FD !important; }
  html.dark .text-\[\#7A6E45\] { color: #CBD5E1 !important; }
  html.dark .text-\[\#94875A\] { color: #94A3B8 !important; }
  html.dark .text-\[\#B8AE8A\] { color: #94A3B8 !important; }
  html.dark .text-\[\#DB8500\] { color: #FBBF24 !important; }

  /* Borders */
  html.dark .border-\[\#A7F3D0\] { border-color: rgba(52,211,153,0.35) !important; }
  html.dark .border-\[\#DDD0FA\] { border-color: rgba(167,139,250,0.35) !important; }
  html.dark .border-\[\#E2E8F0\] { border-color: rgba(255,255,255,0.1) !important; }
  html.dark .border-\[\#E8ECF8\] { border-color: rgba(255,255,255,0.08) !important; }
  html.dark .border-\[\#F3E9C6\] { border-color: rgba(255,255,255,0.08) !important; }
  html.dark .border-\[\#FDE68A\] { border-color: rgba(251,191,36,0.35) !important; }

  /* Theme toggle switch */
  .theme-toggle-btn { position: relative; }
  .theme-toggle-btn .icon-sun { display: none; }
  html.dark .theme-toggle-btn .icon-moon { display: none; }
  html.dark .theme-toggle-btn .icon-sun { display: inline-flex; }
</style>

/* ---------------------------- THEME (dark / light) ---------------------------- */

function initTheme(){
  const saved = localStorage.getItem('novakinmind-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  STATE.theme = saved || (prefersDark ? 'dark' : 'light');
  applyTheme();
}

function applyTheme(){
  document.documentElement.classList.toggle('dark', STATE.theme === 'dark');
  localStorage.setItem('novakinmind-theme', STATE.theme);
}

function toggleTheme(){
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  render();
}

function themeToggleButton(extraClass=''){
  return `
    <button onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"
      class="theme-toggle-btn ${extraClass || 'w-10 h-10 rounded-full bg-[#F2F3FF] text-[#626987] hover:bg-[#E8ECF8]'} flex items-center justify-center transition">
      <span class="material-symbols-outlined text-[20px] icon-moon">dark_mode</span>
      <span class="material-symbols-outlined text-[20px] icon-sun">light_mode</span>
    </button>`;
}

function nav(view, opts){
  STATE.view = view;
  if (opts) Object.assign(STATE, opts);
  window.scrollTo({top:0, behavior:'instant'});
  render();
}

function switchRole(role){
  STATE.role = role;
  STATE.view = role === 'parent' ? 'p-dashboard' : 'c-home';

/* ---------------------------- RENDER DISPATCH ---------------------------- */

function highlightNavId(){
  if (STATE.view.startsWith('c-game')) return 'c-games';
  if (STATE.view.startsWith('c-story')) return 'c-stories';
  if (STATE.view.startsWith('c-exercise')) return 'c-exercises';
  return STATE.view;
}

function render(){
  const root = document.getElementById('root');
  const activeNav = highlightNavId();

  if (STATE.view === 'landing'){
    root.innerHTML = viewLanding();
    return;
  }

  let content = '';
  switch (STATE.view){
    case 'p-dashboard': content = viewParentDashboard(); break;
    case 'p-children': content = viewParentChildren(); break;
    case 'p-child-profile': content = viewParentChildProfile(); break;
    case 'p-coach': content = viewParentCoach(); break;
    case 'p-experiences': content = viewParentExperiences(); break;
    case 'p-story-detail': content = viewParentStoryDetail(); break;
    case 'p-games': content = viewParentGames(); break;
    case 'p-exercises': content = viewParentExercises(); break;
    case 'p-progress': content = viewParentProgress(); break;
    case 'p-insights': content = viewParentInsights(); break;
    case 'p-profile': content = viewParentProfile(); break;

    case 'c-home': content = viewChildHome(); break;
    case 'c-games': content = viewChildGames(); break;
    case 'c-game-play': content = viewChildGamePlay(); break;
    case 'c-exercises': content = viewChildExercises(); break;
    case 'c-stories': content = viewChildStories(); break;
    case 'c-story-player': content = viewChildStoryPlayer(); break;
    case 'c-story-end': content = viewChildStoryEnd(); break;
    case 'c-rewards': content = viewChildRewards(); break;
    case 'c-progress': content = viewChildProgress(); break;

    default: content = viewParentDashboard();
  }

  // temporarily override STATE.view for nav highlight purposes via a wrapper var read by chrome fns
  const realView = STATE.view;
  STATE.view = activeNav;
  root.innerHTML = STATE.role === 'child' ? childChrome(`<div id="content">${content}</div>`) : parentChrome(`<div id="content">${content}</div>`);
  STATE.view = realView;
}

/* ---------------------------- INIT ---------------------------- */

document.addEventListener('DOMContentLoaded', () => { initTheme(); render(); });
